name: TW Stock 30K Intraday Monitor & 1700 EOD Scanner

on:
  schedule:
    # 1. 盤中即時監控：UTC 00:25 = 台灣時間週一至週五早上 08:25 啟動，常駐監控至 13:40
    - cron: '25 0 * * 1-5'
    # 2. 盤後選股日報：UTC 08:55 = 台灣時間週一至週五下午 16:55 啟動，17:00 推播日報
    - cron: '55 8 * * 1-5'
  workflow_dispatch:
    inputs:
      run_mode:
        description: '選擇執行模式 (eod = 立即跑盤後日報, intraday = 啟動盤中即時監控)'
        required: true
        default: 'eod'

permissions:
  contents: write

jobs:
  stock_agent:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run Scanner Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scanner.py ${{ github.event.inputs.run_mode }}
          elif [ "$(date -u +%H)" -lt "06" ]; then
            python scanner.py intraday
          else
            python scanner.py eod
          fi

      - name: Save Active Positions to Repository
        if: always()
        run: |
          if [ -f positions.json ]; then
            git config user.name "stock-monitor-bot"
            git config user.email "bot@users.noreply.github.com"
            git add positions.json
            git diff --staged --quiet || (git pull --rebase && git commit -m "Update active positions" && git push)
          fi
